name: Deploy DhammaSeed para Lighthouse IPFS

on:
  push:
    branches:
      - main # (Se o seu branch principal chamar 'master', mude aqui)

jobs:
  deploy-to-ipfs:
    runs-on: ubuntu-latest
    steps:
      - name: 🧘‍♂️ Meditação Inicial (Checkout do Repositório)
        uses: actions/checkout@v4

      - name: 📦 Preparando o Solo (Instalando Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🚀 Preparando a Ponte (Instalando SDK Puro)
        run: npm install @lighthouse-web3/sdk

      - name: 🌌 Fixando a Joia no IPFS (Via Código Puro)
        env:
          LIGHTHOUSE_API_KEY: ${{ secrets.LIGHTHOUSE_API_KEY }}
        run: |
          cat << 'EOF' > deploy.mjs
          import lighthouse from '@lighthouse-web3/sdk';
          
          async function run() {
            console.log('Iniciando a oferenda ao cosmos (sem senhas, sem perguntas, apenas luz)...');
            try {
              const uploadResponse = await lighthouse.upload('./pipeline/13-static-site', process.env.LIGHTHOUSE_API_KEY);
              const data = uploadResponse.data;
              
              console.log('\n✅ Oferenda de 400MB ancorada em Svalbard com sucesso!');
              
              // O IPFS devolve a lista de arquivos. Vamos extrair apenas o CID da pasta principal!
              if (Array.isArray(data)) {
                const root = data.find(item => item.Name === '13-static-site') || data[data.length - 1];
                console.log('\n💎💎💎 SEU NOVO CID É: ' + root.Hash + ' 💎💎💎\n');
              } else {
                console.log('\n💎💎💎 SEU NOVO CID É: ' + data.Hash + ' 💎💎💎\n');
              }
              
            } catch (e) {
              console.error('Tropeço cósmico:', e);
              process.exit(1);
            }
          }
          run();
          EOF
          node deploy.mjs
