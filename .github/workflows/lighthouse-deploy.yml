name: Deploy DhammaSeed para Lighthouse IPFS

on:
  push:
    branches:
      - main # (Se o seu branch principal chamar 'master', mude aqui)

jobs:
  deploy-to-ipfs:
    runs-on: ubuntu-latest
    steps:
      - name: 🧘‍♂️ Meditação Inicial (Checkout do Repositório)
        uses: actions/checkout@v4

      - name: 📦 Preparando o Solo (Instalando Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🚀 Preparando a Ponte (Instalando Farol Oficial)
        run: npm install -g @lighthouse-web3/sdk

      - name: 🌌 Fixando a Joia no IPFS (Com Escudo TTY)
        env:
          LIGHTHOUSE_API_KEY: ${{ secrets.LIGHTHOUSE_API_KEY }}
        run: |
          echo "Criando o escudo de proteção visual..."
          echo "process.stdout.clearLine = function() {}; process.stdout.cursorTo = function() {};" > escudo.js
          export NODE_OPTIONS="--require ./escudo.js"
          
          echo "Guardando a chave no coração do monge-assistente..."
          lighthouse-web3 api-key --import $LIGHTHOUSE_API_KEY
          
          echo "Iniciando a Entrega ao cosmos com perfeição..."
          echo "Y" | lighthouse-web3 upload pipeline/13-static-site
